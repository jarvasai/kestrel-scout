name: Feature request
description: Suggest a scoped feature, test, CAD improvement, or documentation change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or learning goal
      description: What maker need or measurable learning outcome does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest testable version and any hardware, power, license, or budget impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should it be validated?
      description: Give reproducible pass/fail criteria; identify physical testing needed.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution / provenance
      options:
        - label: I can help implement or test this.
          required: false
        - label: Any included CAD/code/media is my work or I have permission to redistribute it.
          required: true
